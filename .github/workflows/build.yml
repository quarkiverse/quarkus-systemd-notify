name: Build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        #        os: [windows-latest, macos-latest, ubuntu-latest]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false
        if: startsWith(matrix.os, 'windows')

      - uses: actions/checkout@v3
      # quarkiverse-parent compiles with release 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      # Quarkus 999-SNAPSHOT (main, the future Quarkus 4) : the daily snapshot of quarkusio/quarkus-ecosystem-ci
      - name: Install the Quarkus snapshot
        uses: quarkusio/install-quarkus-snapshots-action@main

      # SystemdNotifyIT runs the application as systemd services : the runner boots with systemd and has passwordless
      # sudo
      - name: Build with Maven
        run: mvn -B -nsu formatter:validate clean install --file pom.xml

      # not cached with the Maven repository
      - name: Remove the Quarkus snapshot
        if: always()
        uses: quarkusio/install-quarkus-snapshots-action/cleanup@main

  native:
    name: Native on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Install the Quarkus snapshot
        uses: quarkusio/install-quarkus-snapshots-action@main

      # The native executable is built in a container (Docker), and SystemdNotifyIT runs it as systemd services
      - name: Build the native executable and run the integration tests
        run: mvn -B -nsu clean install -Dnative -Dquarkus.native.container-build=true -Dnative.surefire.skip --file pom.xml

      - name: Remove the Quarkus snapshot
        if: always()
        uses: quarkusio/install-quarkus-snapshots-action/cleanup@main
